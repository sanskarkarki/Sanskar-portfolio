<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sanskar Karki | Interactive Portfolio World</title>

  <meta
    name="description"
    content="Explore Sanskar Karki's interactive portfolio world. Walk through a playable pixel town to discover projects, experience, skills, publications, and ways to connect."
  />

  <meta name="author" content="Sanskar Karki" />
  <meta name="theme-color" content="#101d2b" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sanskar Karki Portfolio" />
  <meta property="og:title" content="Sanskar Karki | Interactive Portfolio World" />
  <meta
    property="og:description"
    content="A playable pixel-world portfolio where projects, publications, skills, and contact information become explorable locations."
  />
 

  <!-- Twitter / X -->
  <meta name="twitter:title" content="Sanskar Karki | Interactive Portfolio World" />
  <meta
    name="twitter:description"
    content="Explore Sanskar Karki's playable pixel portfolio and discover projects, publications, and contact links."
  />


  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
 

  <!-- Main game styles -->
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

  <!-- =========================================================
       MAIN PLAYABLE WORLD
       ========================================================= -->

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>


  <!-- =========================================================
       DEBUG INSPECTION PANEL
       ========================================================= -->

  <div id="debug-panel" class="hidden retro-window">

    <h3>Engine Inspection</h3>

    <div class="debug-row">
      FPS:
      <span id="debug-fps" class="debug-val">0</span>
    </div>

    <div class="debug-row">
      Objects:
      <span id="debug-objs" class="debug-val">0</span>
    </div>

    <div class="debug-row">
      Cam Pos:
      <span id="debug-cam" class="debug-val">0,0</span>
    </div>

    <div class="debug-row">
      Player Pos:
      <span id="debug-player" class="debug-val">0,0</span>
    </div>

    <div class="debug-row">
      State:
      <span id="debug-state" class="debug-val">IDLE</span>
    </div>

    <div class="debug-hint">
      [F3] Close Debugger
    </div>

  </div>


  <!-- =========================================================
       ONBOARDING SCREEN
       ========================================================= -->

  <div id="onboarding-ui">

    <div class="onboarding-content">

      <h2>Welcome to Sanskar's World</h2>

      <p>
        Use WASD or tap the screen / joystick to move.
        <br />
        Press SPACE or E at the buildings for info.
      </p>

      <button id="start-btn" class="retro-btn">
        Start Game
      </button>

    </div>

  </div>


  <!-- =========================================================
       HUD
       ========================================================= -->

  <div id="hud-ui">

    <!-- Profile -->
    <div class="hud-profile">

      <div class="hud-avatar"></div>

      <div class="hud-info">

        <h4>Sanskar Karki</h4>

        <p>
          AI / ML Engineer &amp; Full-Stack Developer
        </p>

      </div>

    </div>


    <!-- Quick Controls -->
    <div class="hud-links">

      <button
        id="lang-btn"
        class="hud-link"
        title="Toggle Language"
      >
        EN
      </button>

      <div class="hud-zoom">

        <button
          id="btn-zoom-in"
          class="hud-link"
          title="Zoom In"
        >
          +
        </button>

        <button
          id="btn-zoom-out"
          class="hud-link"
          title="Zoom Out"
        >
          -
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       DIALOG / INTERACTION UI
       ========================================================= -->

  <div
    id="dialog-ui"
    class="hidden retro-window"
  >

    <div class="dialog-box">

      <div class="dialog-avatar"></div>

      <div class="dialog-content">

        <h3 id="dialog-title">
          Name
        </h3>

        <p id="dialog-body">
          Text goes here...
        </p>


        <!--
          Buttons are dynamically generated by main.ts.

          Examples:
          ABOUT ME       → /about.html
          FUN PROJECTS   → /projects.html
          PUBLICATION    → /publication.html
          CONTACT ME     → /contact.html
          SOCIALS        → Instagram / Facebook / Twitter
        -->

        <div
          id="dialog-actions"
          class="hidden"
        >
          <!-- Dynamic Action Buttons -->
        </div>

      </div>

      <div class="dialog-arrow"></div>

    </div>

  </div>


  <!-- =========================================================
       MOBILE CONTROLS
       ========================================================= -->

  <div id="mobile-controls">

    <div class="dpad">

      <button
        id="btn-up"
        class="dpad-btn up"
        aria-label="Move up"
      ></button>

      <button
        id="btn-left"
        class="dpad-btn left"
        aria-label="Move left"
      ></button>

      <button
        id="btn-right"
        class="dpad-btn right"
        aria-label="Move right"
      ></button>

      <button
        id="btn-down"
        class="dpad-btn down"
        aria-label="Move down"
      ></button>

      <div class="dpad-center"></div>

    </div>


    <div class="action-buttons">

      <button
        id="btn-a"
        class="action-btn"
        aria-label="Interact"
      >
        A
      </button>

    </div>

  </div>


  <!-- =========================================================
       GAME ENTRY
       ========================================================= -->

  <script
    type="module"
    src="/src/main.ts"
  ></script>

</body>

</html>
